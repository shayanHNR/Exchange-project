<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لیست مشتریان</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h2 class="mb-4">لیست مشتریان</h2>
<form method="get" class="mb-3">
    <input
        type="text"
        name="search"
        value="{{ search }}"
        class="form-control"
        placeholder="نام مشتری را وارد کنید...">
    <button
        type="submit"
        class="btn btn-primary mt-2">
        جستجو
    </button>
</form>
<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>نام</th>
            <th>شماره تماس</th>
            <th>مانده حساب</th>
            <th>گزارش</th>
        </tr>
    </thead>
   <table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>نام</th>
            <th>شماره تماس</th>
            <th>مانده حساب</th>
            <th>گزارش</th>
        </tr>
    </thead>
    <tbody>
    {% for customer in customers %}
        <tr>
            <td>{{ customer.name }}</td>
            <td>{{ customer.phone }}</td>
            <td>
                {% for currency, amount in customer.get_balance.items %}
                    {{ currency }} : {{ amount }}
                    <br>
                {% empty %}
                    0
                {% endfor %}
            </td>
            <td>
                <a
                    href="/customer/{{ customer.id }}/report/"
                    class="btn btn-primary btn-sm" >
                    مشاهده گزارش
                </a>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
</table>
</body>
</html>
